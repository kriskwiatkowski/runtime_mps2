name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build-packages:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        preset: [an385, an386, an500, an521, an385-minsizerel, an385-minsizerel-armcompat, an386-minsizerel, an500-minsizerel, an521-minsizerel, an385-debug, an386-debug, an500-debug, an521-debug]
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          cmake \
          ninja-build \
          gcc-arm-none-eabi

    - name: Extract version from tag
      id: version
      run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

    - name: Configure CMake
      run: cmake --preset ${{ matrix.preset }}

    - name: Build
      run: cmake --build --preset ${{ matrix.preset }}

    - name: Create package with CPack
      run: cpack --preset ${{ matrix.preset }}

    - name: Upload package
      uses: actions/upload-artifact@v4
      with:
        name: package-${{ matrix.preset }}
        path: out/package/${{ matrix.preset }}/*.tar.gz
        retention-days: 7

  create-release:
    needs: build-packages
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
    - name: Download all packages
      uses: actions/download-artifact@v4
      with:
        pattern: package-*
        merge-multiple: true
        path: packages

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: packages/*.tar.gz
        generate_release_notes: true
